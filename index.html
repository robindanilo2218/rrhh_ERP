<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TurnoSync - Procesos y Planillas</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- PWA Manifest Link -->
    <link id="manifest-link" rel="manifest" href="">

    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; -webkit-tap-highlight-color: transparent; }

        .calendar-day { min-height: 80px; }
        
        .old-empalme { background-color: #fee2e2; border: 2px solid #ef4444; color: #991b1b; }
        .old-manana { background-color: #fef9c3; border: 1px solid #fde047; color: #854d0e; }
        .old-tarde { background-color: #ffedd5; border: 1px solid #fdba74; color: #9a3412; }
        .old-noche { background-color: #e2e8f0; border: 1px solid #cbd5e1; color: #334155; }
        
        @media print {
            body * { visibility: hidden; }
            #boleta-imprimible, #boleta-imprimible * { visibility: visible; }
            #boleta-imprimible { position: absolute; left: 0; top: 0; width: 100%; border: none !important; box-shadow: none !important; }
            .no-print { display: none !important; }

        .bg-paper { background-color: #fdfbf7; background-image: url('data:image/svg+xml,%3Csvg width="100" height="100" xmlns="http://www.w3.org/2000/svg"%3E%3Cfilter id="noise"%3E%3CfeTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="4" stitchTiles="stitch"/%3E%3C/filter%3E%3Crect width="100" height="100" fill="%23fdfbf7"/%3E%3Crect width="100" height="100" filter="url(%23noise)" opacity="0.08"/%3E%3C/svg%3E'); }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 antialiased min-h-screen flex flex-col">

    <!-- Navbar -->
    <nav class="bg-blue-900 text-white shadow-md no-print">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex items-center justify-between h-16">
                <div class="flex items-center gap-3">
                    <i class="fa-solid fa-industry text-2xl text-blue-300"></i>
                    <span class="font-bold text-xl tracking-wide">TurnoSync <span class="text-xs font-normal text-blue-200">Planta</span></span>
                </div>
                <div id="nav-user-info" class="hidden flex items-center gap-4">
                    <span id="nav-user-name" class="text-sm font-medium hidden sm:block"></span>
                    <button onclick="App.logout()" class="bg-blue-800 hover:bg-blue-700 px-3 py-1.5 rounded text-sm transition-colors shadow-sm border border-blue-700">
                        <i class="fa-solid fa-right-from-bracket mr-1"></i> Salir

    <!-- Main Content Area -->
    <main id="app-container" class="flex-grow flex flex-col p-4 sm:p-6 max-w-7xl mx-auto w-full">
        <!-- Vistas renderizadas por JS -->
    </main>

    <footer class="bg-slate-200 text-slate-500 text-center py-4 text-xs mt-auto no-print">
        &copy; 2026 TurnoSync Industrial - Modelo 2-2-3 Optimizado. Corrugadora Guatemala S.A.
    </footer>

    <script>
        // ==========================================
        // CONFIGURACIÓN PWA Y MANIFEST
        // ==========================================
        const manifestJSON = {
            "name": "TurnoSync Gestión Laboral", "short_name": "TurnoSync", "display": "standalone", "background_color": "#f8fafc", "theme_color": "#1e3a8a",
            "icons": [{"src": "data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCAyNCAyNCIgZmlsbD0iIzFlM2E4YSI+PHBhdGggZD0iTTEyIDJDMi42OSAyIDEwLjA5IDQgOS4yNyA0LjAzbC0xLjA2LjA2QzcuMTQgNC4yNSA2LjIzIDQuNiA1LjQzIDUuNDNjLS44LjgtMS4xNSAxLjcxLTEuMzQgMi43OGwtLjA2IDEuMDZDMiAyIDEgMi42OSAxIDEyYzAgOS4zMSAxIDkuOTEgMS45NyA5Ljk3bDEuMDYuMDZjLjguMTYgMS43MS41MSAyLjUxIDEuMzEuOC44IDEuMTUgMS43MSAxLjM0IDIuNzhsLjA2IDEuMDZDMiAyMiAyLjY5IDIzIDEyIDIzYzkuMzEgMCA5LjkxLTEgOS45Ny0xLjk3bC4wNi0xLjA2Yy4xNi0uOC41MS0xLjcxIDEuMzEtMi41MS44LS44IDEuNzEtMS4xNSAyLjc4LTEuMzRsMS4wNi0uMDZDMjIgMjIgMjMgMjEuMzEgMjMgMTJjMC05LjMxLTEtOS45MS0xLjk3LTkuOTdsLTEuMDYtLjA2Yy0uOC0uMTYtMS43MS0uNTEtMi41MS0xLjMxLS44LS44LTEuMTUtMS43MS0xLjM0LTIuNzhsLS4wNi0xLjA2QzIyIDIgMjEuMzEgMSAxMiAxaC0yem0wIDJhOCA4IDAgMTAwIDE2IDggOCAwIDAwMC0xNnptMCAxLjVhNi41IDYuNSAwIDExMCAxMyA2LjUgNi41IDAgMDExMC0xM3pNMTIgN2ExIDEgMCAwMTAgMmgzdjNhMSAxIDAgMDEwIDJoLTRhMSAxIDAgMDEwLTIgM2gtMnYtM2ExIDEgMCAwMTAtMmg0YTEgMSAwIDAwMC0yeiIvPjwvc3ZnPg==", "sizes": "192x192", "type": "image/svg+xml"}]
        };
        const manifestBlob = new Blob([JSON.stringify(manifestJSON)], {type: 'application/manifest+json'});
        document.getElementById('manifest-link').href = URL.createObjectURL(manifestBlob);

        // ==========================================
        // BASE DE DATOS LOCAL (IndexedDB)
        // ==========================================
        const DB = {
            dbName: 'TurnoSyncDB_v7',
            version: 1,
            db: null,
            init() {
                return new Promise((resolve, reject) => {
                    const request = indexedDB.open(this.dbName, this.version);
                    request.onupgradeneeded = (e) => {
                        const db = e.target.result;
                        if (!db.objectStoreNames.contains('employees')) {
                            const empStore = db.createObjectStore('employees', { keyPath: 'dpi' });
                            empStore.createIndex('numEmpleado', 'numEmpleado', { unique: true });
                        }
                        if (!db.objectStoreNames.contains('settings')) db.createObjectStore('settings', { keyPath: 'id' });
                    };
                    request.onsuccess = async (e) => { this.db = e.target.result; await this.initDefaultSettings(); resolve(); };
                    request.onerror = (e) => reject(e);
                });
            },
            initDefaultSettings() {
                return new Promise(async (resolve) => {
                    let settings = await this.get('settings', 'config');
                    if (!settings) {
                        settings = { id: 'config', holidays: [ { date: '2026-05-01', name: 'Día del Trabajo', isWorked: true } ] };
                    }
                    // Inicialización y Migración de Catálogos de Estructura Organizacional
                    if (!settings.maquinas) settings.maquinas = [{ nombre: 'Corrugadora 1', activa: true }];
                    
                    if (!settings.supervisores) {
                        settings.supervisores = [{ nombre: 'Supervisor General', maquinas: ['Corrugadora 1'] }];
                    } else if (settings.supervisores.length > 0 && typeof settings.supervisores[0] === 'string') {
                        // Migrar datos antiguos (textos simples) al nuevo formato relacional (objetos)
                        settings.supervisores = settings.supervisores.map(s => ({ nombre: s, maquinas: [] }));
                    }

                    if (!settings.puestos) settings.puestos = ['Operador', 'Ayudante', 'Tintero', 'Alimentador', 'Entarimador 1', 'Entarimador 2'];
                    
                    await this.put('settings', settings);
                    resolve();
                });
            },
            get(storeName, key) {
                return new Promise((resolve, reject) => {
                    const tx = this.db.transaction(storeName, 'readonly');
                    const request = tx.objectStore(storeName).get(key);
                    request.onsuccess = () => resolve(request.result);
                    request.onerror = () => reject(request.error);
                });
            },
            getAll(storeName) {
                return new Promise((resolve, reject) => {
                    const tx = this.db.transaction(storeName, 'readonly');
                    const request = tx.objectStore(storeName).getAll();
                    request.onsuccess = () => resolve(request.result);
                    request.onerror = () => reject(request.error);
                });
            },
            put(storeName, item) {
                return new Promise((resolve, reject) => {
                    const tx = this.db.transaction(storeName, 'readwrite');
                    const request = tx.objectStore(storeName).put(item);
                    request.onsuccess = () => resolve(request.result);
                    request.onerror = () => reject(request.error);
                });
            },
            delete(storeName, key) {
                return new Promise((resolve, reject) => {
                    const tx = this.db.transaction(storeName, 'readwrite');
                    const request = tx.objectStore(storeName).delete(key);
                    request.onsuccess = () => resolve();
                    request.onerror = () => reject(request.error);
                });
            },
            async exportJSON() {
                const employees = await this.getAll('employees');
                const settings = await this.getAll('settings');
                const blob = new Blob([JSON.stringify({ employees, settings }, null, 2)], { type: 'application/json' });
                const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `TurnoSync_Backup.json`; a.click();
            },
            async importJSON(jsonData) {
                try {
                    const data = JSON.parse(jsonData);
                    if (data.employees) for (const emp of data.employees) await this.put('employees', emp);
                    if (data.settings) for (const set of data.settings) await this.put('settings', set);
                    return true;
                } catch (e) { return false; }
            }
        };

        // ==========================================
        // LÓGICA DE NEGOCIO Y CÁLCULO
        // ==========================================
        const App = {
            currentUser: null, role: null, settings: null,
            calendarViewMode: 'new',
            anchorDate: new Date('2026-05-04T00:00:00-06:00'),
            
            patternA: ['D','D','L','L','D','D','D','L','L','D','D','L','L','L','N','N','L','L','N','N','N','L','L','N','N','L','L','L'],
            patternB: ['N','N','L','L','N','N','N','L','L','N','N','L','L','L','D','D','L','L','D','D','D','L','L','D','D','L','L','L'],
            patternC: ['L','L','D','D','L','L','L','D','D','L','L','D','D','D','L','L','N','N','L','L','L','N','N','L','L','N','N','N'],
            patternD: ['L','L','N','N','L','L','L','N','N','L','L','N','N','N','L','L','D','D','L','L','L','D','D','L','L','D','D','D'],
            oldCycle1: ['M','M','M','M','M','M','N12', 'N','N','N','N','N','N','L', 'T','T','T','T','T','T','D12'],

            async init() { await DB.init(); this.settings = await DB.get('settings', 'config'); this.renderLogin(); },

            async login(dpi, numEmpleado) {
                if (dpi === 'admin' && numEmpleado === 'admin') {
                    this.currentUser = { nombre: 'Administrador General' }; this.role = 'admin'; this.updateNav(); UI.renderAdminDashboard(); return;
                }
                const emp = await DB.get('employees', dpi);
                if (emp && emp.numEmpleado === numEmpleado) {
                    this.currentUser = emp; this.role = 'employee'; this.calendarViewMode = 'boleta'; this.updateNav(); UI.renderEmployeeDashboard();
                } else { alert('Credenciales incorrectas.'); }
            },

            logout() { this.currentUser = null; this.role = null; document.getElementById('nav-user-info').classList.add('hidden'); this.renderLogin(); },
            updateNav() { document.getElementById('nav-user-info').classList.remove('hidden'); document.getElementById('nav-user-name').innerText = this.currentUser.nombre; },

            renderLogin() {
                document.getElementById('app-container').innerHTML = `
                    <div class="flex-grow flex items-center justify-center fade-in">
                        <div class="bg-white p-8 rounded-xl shadow-lg w-full max-w-md border border-slate-100">
                            <div class="text-center mb-6">
                                <div class="bg-blue-100 w-16 h-16 rounded-full flex items-center justify-center mx-auto mb-4"><i class="fa-solid fa-users text-2xl text-blue-800"></i></div>
                                <h2 class="text-2xl font-bold text-slate-800">Portal de Acceso</h2>
                                <p class="text-sm text-slate-500 mt-1">Ingresa para ver tu turno y boleta de pago</p>
                            </div>
                            <form id="login-form" class="space-y-4">
                                <div><input type="text" id="login-dpi" class="w-full border border-slate-300 rounded-lg px-4 py-2 focus:ring-2 focus:ring-blue-500 outline-none" placeholder="Ingresa tu DPI" required></div>
                                <div><input type="text" id="login-num" class="w-full border border-slate-300 rounded-lg px-4 py-2 focus:ring-2 focus:ring-blue-500 outline-none" placeholder="Número de Empleado" required></div>
                                <button type="submit" class="w-full bg-blue-800 hover:bg-blue-700 text-white font-bold py-2.5 rounded-lg shadow-md mt-2">Ingresar al Sistema</button>
                            </form>
                            <div class="mt-6 pt-4 border-t border-slate-200">
                                <label class="w-full flex items-center justify-center gap-2 bg-slate-100 hover:bg-slate-200 text-slate-700 py-2 px-4 rounded-lg cursor-pointer text-sm font-semibold">
                                    <i class="fa-solid fa-file-import"></i> Importar Datos (JSON)
                                    <input type="file" class="hidden" id="import-json-input" accept=".json">
                                </label>
                            </div>
                        </div>
                    </div>`;
                document.getElementById('login-form').addEventListener('submit', (e) => { e.preventDefault(); this.login(document.getElementById('login-dpi').value.trim(), document.getElementById('login-num').value.trim()); });
                document.getElementById('import-json-input').addEventListener('change', (e) => {
                    const file = e.target.files[0]; if (!file) return; const reader = new FileReader();
                    reader.onload = async (event) => { if (await DB.importJSON(event.target.result)) { alert("Datos actualizados. Inicia sesión."); App.init(); } };
                    reader.readAsText(file);
                });
            },

            calcularBoletaCatorcenal(emp) {
                const sbm = Number(emp.salarioBase || 5001.60);
                const valorHora = sbm / 30 / 8;
                const valorExtra = valorHora * 1.5;

                const hrsOrd = emp.hrsOrd !== undefined ? Number(emp.hrsOrd) : 56;
                const hrsExt = emp.hrsExt !== undefined ? Number(emp.hrsExt) : 28;

                const devOrd = hrsOrd * valorHora;
                const devExt = hrsExt * valorExtra;
                
                const adicionales = Number(emp.adicionales || 0);
                const bonoIncentivo = 116.67; 
                const bonoExtraordinario = 144.67; 
                const feriados = Number(emp.feriados || 0);

                const septimoDia = (devOrd + devExt + bonoIncentivo) / 6;

                const totalDevengado = devOrd + devExt + septimoDia + bonoIncentivo + bonoExtraordinario + adicionales + feriados;

                const baseIgss = devOrd + devExt + septimoDia + adicionales + feriados;
                const igss = baseIgss * 0.0483;
                
                const cafeteria = Number(emp.deduccionCafeteria || 0);
                const isr = Number(emp.isr || 0);
                const moto = Number(emp.cuotaMoto || 0);

                const totalDeducciones = igss + cafeteria + isr + moto;
                const neto = totalDevengado - totalDeducciones;

                return {
                    valorHora, valorExtra, hrsOrd, hrsExt,
                    devOrd, devExt, adicionales, bonoIncentivo, bonoExtraordinario, feriados, septimoDia, totalDevengado,
                    baseIgss, igss, cafeteria, isr, moto, totalDeducciones, neto,
                    periodoNombre: 'Proyección Actual', fecha: new Date().toISOString()
                };
            },

            async guardarPlanillaGlobal(periodoNombre) {
                const employees = await DB.getAll('employees');
                for (let emp of employees) {
                    const boleta = this.calcularBoletaCatorcenal(emp);
                    boleta.periodoNombre = periodoNombre;
                    
                    if (!emp.historial) emp.historial = [];
                    emp.historial.unshift(boleta);
                    
                    // Resetear variables operativas de la planilla
                    emp.adicionales = 0;
                    emp.feriados = 0;
                    emp.deduccionCafeteria = 0; 
                    emp.isr = 0; 
                    emp.hrsOrd = 56; 
                    emp.hrsExt = 28; 
                    
                    await DB.put('employees', emp);
                }
            },

            formatMoney(amount) { return new Intl.NumberFormat('es-GT', { style: 'currency', currency: 'GTQ' }).format(amount); },
            
            getNewShiftForDate(dateStr, cuadrilla) {
                const targetDate = new Date(`${dateStr}T00:00:00-06:00`);
                const diffTime = targetDate.getTime() - this.anchorDate.getTime();
                const diffDays = Math.floor(diffTime / (1000 * 60 * 60 * 24));
                let cycleDay = diffDays % 28;
                if (cycleDay < 0) cycleDay += 28;

                let result = 'L';
                if (cuadrilla === 'A') result = this.patternA[cycleDay];
                if (cuadrilla === 'B') result = this.patternB[cycleDay];
                if (cuadrilla === 'C') result = this.patternC[cycleDay];
                if (cuadrilla === 'D') result = this.patternD[cycleDay];
                return result;
            },
            getOldShiftForDate(dateStr, old) {
                const targetDate = new Date(`${dateStr}T00:00:00-06:00`);
                const diffTime = targetDate.getTime() - this.anchorDate.getTime();
                const diffDays = Math.floor(diffTime / (1000 * 60 * 60 * 24));
                let cycleDay = diffDays % 21;
                if (cycleDay < 0) cycleDay += 21;
                return this.oldCycle1[cycleDay];
            }
        };

        // ==========================================
        // RENDERIZADO DE INTERFAZ (UI)
        // ==========================================
        const UI = {
            async renderAdminDashboard() {
                const container = document.getElementById('app-container');
                container.innerHTML = `
                    <div class="fade-in w-full space-y-6">
                        <div class="flex flex-col md:flex-row justify-between items-center bg-white p-4 rounded-lg shadow-sm border border-slate-200 gap-4">

                            <div class="flex gap-2 w-full md:w-auto overflow-x-auto pb-1">
                                <button onclick="UI.showAdminTab('estructura')" id="tab-btn-estructura" class="admin-tab-btn bg-slate-200 text-slate-700 px-4 py-2 rounded shadow text-sm font-medium whitespace-nowrap"><i class="fa-solid fa-building mr-1"></i> Estructura</button>
                                <button onclick="UI.showAdminTab('empleados')" id="tab-btn-empleados" class="admin-tab-btn bg-slate-200 text-slate-700 px-4 py-2 rounded shadow text-sm font-medium whitespace-nowrap"><i class="fa-solid fa-address-card mr-1"></i> Empleados</button>
                                <button onclick="UI.showAdminTab('procesos')" id="tab-btn-procesos" class="admin-tab-btn bg-slate-200 text-slate-700 px-4 py-2 rounded shadow text-sm font-medium whitespace-nowrap"><i class="fa-solid fa-sitemap mr-1"></i> Procesos</button>
                                <button onclick="UI.showAdminTab('planillas')" id="tab-btn-planillas" class="admin-tab-btn bg-slate-200 text-slate-700 px-4 py-2 rounded shadow text-sm font-medium whitespace-nowrap"><i class="fa-solid fa-money-check-dollar mr-1"></i> Planillas</button>
                                <button onclick="UI.showAdminTab('historial')" id="tab-btn-historial" class="admin-tab-btn bg-slate-200 text-slate-700 px-4 py-2 rounded shadow text-sm font-medium whitespace-nowrap"><i class="fa-solid fa-clock-rotate-left mr-1"></i> Historial</button>
                                <button onclick="DB.exportJSON()" class="bg-green-600 hover:bg-green-700 text-white px-4 py-2 rounded shadow text-sm font-medium whitespace-nowrap"><i class="fa-solid fa-download mr-1"></i> Exportar</button>
                            </div>
                        </div>
                        <div id="admin-content-area" class="bg-white rounded-lg shadow-sm border border-slate-200 p-4 sm:p-6 min-h-[500px]"></div>
                    </div>
                `;
                this.showAdminTab('estructura');
            },

            async showAdminTab(tab) {
                document.querySelectorAll('.admin-tab-btn').forEach(btn => {
                    btn.classList.remove('bg-blue-800', 'text-white');
                    btn.classList.add('bg-slate-200', 'text-slate-700');
                });
                document.getElementById(`tab-btn-${tab}`).classList.add('bg-blue-800', 'text-white');
                document.getElementById(`tab-btn-${tab}`).classList.remove('bg-slate-200', 'text-slate-700');

                if (tab === 'estructura') this.renderAdminEstructura();
                else if (tab === 'empleados') this.renderAdminEmpleados();
                else if (tab === 'planillas') this.renderAdminPlanillas();
                else if (tab === 'historial') this.renderAdminHistorial();
                else if (tab === 'procesos') this.renderAdminProcesos();
            },

            // --- TAB: ESTRUCTURA ORGANIZACIONAL (CATÁLOGOS) ---
            async renderAdminEstructura() {
                const contentArea = document.getElementById('admin-content-area');
                const maquinas = App.settings.maquinas || [];
                const supervisores = App.settings.supervisores || [];
                const puestos = App.settings.puestos || [];

                let html = `
                    <div class="mb-6">
                        <h2 class="text-xl font-bold text-slate-800">Estructura Organizacional</h2>
                        <p class="text-xs text-slate-500">Gestione los catálogos globales de la empresa. Estos datos alimentarán el mapa de procesos y la asignación de personal.</p>
                    </div>
                    <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
                        
                        <!-- Columna Máquinas -->
                        <div class="bg-slate-50 border border-slate-200 rounded-lg p-4">
                            <h3 class="font-bold text-slate-700 border-b border-slate-200 pb-2 mb-3"><i class="fa-solid fa-microchip text-blue-600 mr-2"></i> Máquinas / Procesos</h3>
                            <form onsubmit="UI.addMaquina(event)" class="flex gap-2 mb-4">
                                <input type="text" id="new-maq" placeholder="Nueva máquina..." class="w-full border border-slate-300 rounded px-2 py-1 text-sm focus:ring-1 focus:ring-blue-500" required>
                                <button type="submit" class="bg-blue-600 hover:bg-blue-700 text-white px-3 py-1 rounded text-sm"><i class="fa-solid fa-plus"></i></button>
                            </form>
                            <ul class="space-y-2 max-h-96 overflow-y-auto pr-1">
                                ${maquinas.map((m, idx) => `
                                    <li class="flex justify-between items-center bg-white p-2 border border-slate-200 rounded shadow-sm">
                                        <div class="flex items-center gap-2">
                                            <button onclick="UI.toggleMaquina(${idx})" class="text-xl ${m.activa ? 'text-green-500' : 'text-slate-300'}" title="${m.activa ? 'Máquina Activa' : 'Máquina Inactiva'}">
                                                <i class="fa-solid ${m.activa ? 'fa-toggle-on' : 'fa-toggle-off'}"></i>
                                            </button>
                                            <span class="text-sm font-medium ${m.activa ? 'text-slate-800' : 'text-slate-400 line-through'}">${m.nombre}</span>
                                        </div>
                                        <button onclick="UI.deleteMaquina(${idx})" class="text-red-500 hover:text-red-700 px-2"><i class="fa-solid fa-trash-can"></i></button>
                                    </li>
                                `).join('')}
                            </ul>
                        </div>

                        <!-- Columna Supervisores (Relacional) -->
                        <div class="bg-slate-50 border border-slate-200 rounded-lg p-4">

                    return;

                const supervisor = App.settings.supervisores.find(s => s.nombre === supName);

            onSupervisorProcesosChange() {
                const supName = document.getElementById('proc-sup').value;
                const maqSelect = document.getElementById('proc-maq');
                
                if (!supName) {
                    maqSelect.innerHTML = '<option value="">-- Seleccione Supervisor Primero --</option>';
                    maqSelect.disabled = true;
                    this.filterProcesosMatrix();
                    return;
                }
                
                const supervisor = App.settings.supervisores.find(s => s.nombre === supName);
                const maquinas = supervisor && supervisor.maquinas ? supervisor.maquinas : [];
                
                if (maquinas.length === 0) {
                    maqSelect.innerHTML = '<option value="">-- Supervisor sin máquinas asignadas --</option>';
                    maqSelect.disabled = true;
                } else {
                    maqSelect.innerHTML = '<option value="">-- Seleccionar Máquina --</option>' + 
                        maquinas.map(m => `<option value="${m}">${m}</option>`).join('');
                    maqSelect.disabled = false;
                }
                this.filterProcesosMatrix();
            },

            async filterProcesosMatrix() {
                const sup = document.getElementById('proc-sup').value;
                const maq = document.getElementById('proc-maq').value;
                const area = document.getElementById('procesos-matrix-area');

                if (!sup || !maq) {
                    area.innerHTML = `<div class="text-center py-12 text-slate-400 bg-slate-50 rounded-lg border border-slate-200 border-dashed">Seleccione ambos campos para cargar la matriz.</div>`;
                    return;
                }

                const employees = await DB.getAll('employees');
                // Filtrar empleados que pertenecen a ese supervisor y maquina
                const team = employees.filter(e => e.supervisor === sup && e.maquina === maq);
                
                const cuadrillas = ['A', 'B', 'C', 'D'];
                const puestosOficiales = App.settings.puestos || [];
                
                // Generar Matriz de Puestos x 4 Cuadrillas
                let matrixHtml = `
                    <div class="bg-white rounded-lg border border-slate-200 overflow-hidden shadow-sm mb-8">
                        <div class="bg-blue-900 text-white p-3 font-bold text-sm flex justify-between items-center">
                            <span><i class="fa-solid fa-microchip mr-2 text-blue-300"></i> ${maq}</span>
                            <span class="text-xs bg-blue-800 px-2 py-1 rounded">Supervisor: ${sup}</span>
                        </div>
                        <div class="overflow-x-auto">
                            <table class="min-w-full divide-y divide-slate-200 text-sm">
                                <thead class="bg-slate-100">
                                    <tr>
                                        <th class="px-4 py-3 text-left font-bold text-slate-700 border-r border-slate-200 w-1/5">Posición Requerida</th>
                                        <th class="px-4 py-3 text-center font-bold text-slate-700 border-r border-slate-200 w-1/5">Cuadrilla A<br><span class="text-[9px] font-normal text-slate-500">Día / Noche</span></th>
                                        <th class="px-4 py-3 text-center font-bold text-slate-700 border-r border-slate-200 w-1/5">Cuadrilla B<br><span class="text-[9px] font-normal text-slate-500">Noche / Día</span></th>
                                        <th class="px-4 py-3 text-center font-bold text-slate-700 border-r border-slate-200 w-1/5">Cuadrilla C<br><span class="text-[9px] font-normal text-slate-500">Libre intercalado</span></th>
                                        <th class="px-4 py-3 text-center font-bold text-slate-700 w-1/5">Cuadrilla D<br><span class="text-[9px] font-normal text-slate-500">Libre intercalado</span></th>
                                    </tr>
                                </thead>
                                <tbody class="bg-white divide-y divide-slate-100">
                `;

                let totalOcupados = 0;
                const totalRequeridos = puestosOficiales.length * 4;

                puestosOficiales.forEach(puesto => {
                    matrixHtml += `<tr><td class="px-4 py-3 font-semibold text-slate-800 bg-slate-50 border-r border-slate-200">${puesto}</td>`;
                    cuadrillas.forEach(cuad => {
                        // Buscar si existe un empleado en esa cuadrilla y puesto para esta máquina
                        const worker = team.find(e => e.cuadrilla === cuad && e.puesto === puesto);
                        if (worker) {
                            totalOcupados++;
                            matrixHtml += `<td class="px-2 py-2 text-center border-r border-slate-100"><div class="bg-green-50 border border-green-200 text-green-800 font-bold px-2 py-1 rounded text-xs truncate max-w-[150px] mx-auto" title="${worker.nombre}">${worker.nombre.split(' ')[0]} ${worker.nombre.split(' ')[1]||''}</div></td>`;
                        } else {
                            matrixHtml += `<td class="px-2 py-2 text-center border-r border-slate-100"><div class="bg-red-50 border border-red-300 text-red-600 font-bold px-2 py-1 rounded text-xs shadow-inner"><i class="fa-solid fa-triangle-exclamation mr-1"></i> VACANTE</div></td>`;
                        }
                    });
                    matrixHtml += `</tr>`;
                });

                matrixHtml += `</tbody></table></div></div>`;

                // Sección de Vacaciones de la Máquina
                let vacHtml = `
                    <div class="bg-white rounded-lg border border-slate-200 p-5 shadow-sm">
                        <h3 class="font-bold text-slate-800 border-b border-slate-100 pb-2 mb-4"><i class="fa-solid fa-umbrella-beach text-orange-500 mr-2"></i> Estatus de Vacaciones (${maq})</h3>
                        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                `;

                if (team.length === 0) {
                    vacHtml += `<div class="col-span-full text-sm text-slate-500">No hay personal asignado.</div>`;
                } else {
                    team.forEach(w => {
                        const maxTurnos = 10;
                        const disp = w.turnosVacacionesDisponibles;
                        const pct = (disp / maxTurnos) * 100;
                        let colorBar = 'bg-blue-500';
                        if(pct <= 30) colorBar = 'bg-red-500';
                        else if(pct <= 60) colorBar = 'bg-amber-400';

                        vacHtml += `
                            <div class="bg-slate-50 border border-slate-200 rounded p-3">
                                <div class="flex justify-between items-start mb-2">
                                    <div>
                                        <div class="text-sm font-bold text-slate-700 truncate w-40">${w.nombre}</div>
                                        <div class="text-[10px] text-slate-500 uppercase">${w.puesto} - Cuadrilla ${w.cuadrilla}</div>
                                    </div>
                                    <div class="text-lg font-black text-slate-700">${disp}<span class="text-[10px] font-normal text-slate-400">/10</span></div>
                                </div>
                                <div class="w-full bg-slate-200 rounded-full h-1.5">
                                    <div class="${colorBar} h-1.5 rounded-full" style="width: ${pct}%"></div>
                                </div>
                                <div class="text-[9px] text-right mt-1 text-slate-500">Turnos 12h Disponibles</div>
                            </div>
                        `;
                    });
                }
                vacHtml += `</div></div>`;

                // Resumen Header
                const vacantes = totalRequeridos - totalOcupados;
                let summaryHtml = `
                    <div class="flex flex-wrap gap-4 mb-6">
                        <div class="bg-blue-50 border border-blue-200 rounded p-3 flex-1 min-w-[150px]">
                            <div class="text-xs text-blue-600 font-bold uppercase">Plazas Requeridas</div>

                        </div>
                        <div class="bg-green-50 border border-green-200 rounded p-3 flex-1 min-w-[150px]">
                            <div class="text-xs text-green-600 font-bold uppercase">Personal Activo</div>
                            <div class="text-2xl font-black text-green-900">${totalOcupados}</div>
                        </div>
                        <div class="${vacantes > 0 ? 'bg-red-50 border-red-200 text-red-900' : 'bg-slate-50 border-slate-200 text-slate-500'} border rounded p-3 flex-1 min-w-[150px]">
                            <div class="text-xs font-bold uppercase ${vacantes > 0 ? 'text-red-600' : 'text-slate-400'}">Foco: Vacantes Libres</div>
                            <div class="text-2xl font-black">${vacantes}</div>
                        </div>
                    </div>
                `;

                area.innerHTML = summaryHtml + matrixHtml + vacHtml;
            },

                                        <div class="flex justify-between"><span>Bonif. Extraordinaria</span> <span>${App.formatMoney(b.bonoExtraordinario)}</span></div>
                                        ${b.adicionales > 0 ? `<div class="flex justify-between"><span>Adicionales</span> <span>${App.formatMoney(b.adicionales)}</span></div>` : ''}
                                        ${b.feriados > 0 ? `<div class="flex justify-between"><span>Feriados</span> <span>${App.formatMoney(b.feriados)}</span></div>` : ''}
                                    </div>
                                </div>
                                <div>
                                    <h3 class="font-black border-b-2 border-slate-800 pb-1 mb-3">DEDUCCIONES</h3>
                                    <div class="space-y-1">
                                        <div class="flex justify-between"><span>IGSS Laboral (4.83%)</span> <span>${App.formatMoney(b.igss)}</span></div>
                                        ${b.cafeteria > 0 ? `<div class="flex justify-between"><span>Cafetería</span> <span>${App.formatMoney(b.cafeteria)}</span></div>` : ''}
                                        ${b.moto > 0 ? `<div class="flex justify-between"><span>Préstamo Moto</span> <span>${App.formatMoney(b.moto)}</span></div>` : ''}
                                        ${b.isr > 0 ? `<div class="flex justify-between"><span>ISR</span> <span>${App.formatMoney(b.isr)}</span></div>` : ''}
                                    </div>
                                </div>
                            </div>
                            <div class="border-t-2 border-slate-800 pt-3 flex flex-col items-end">
                                <div class="w-full md:w-1/2 space-y-2">
                                    <div class="flex justify-between font-bold"><span>Devengado:</span> <span>${App.formatMoney(b.totalDevengado)}</span></div>
                                    <div class="flex justify-between font-bold text-red-700"><span>Deducciones:</span> <span>${App.formatMoney(b.totalDeducciones)}</span></div>
                                    <div class="flex justify-between text-lg font-black bg-slate-100 p-2 border border-slate-300 mt-2"><span>NETO A PAGAR:</span> <span>${App.formatMoney(b.neto)}</span></div>
                                </div>
                            </div>
                        </div>
                    </div>
                `;
            },

            renderCalendarGrid() {
                const calDiv = document.getElementById('calendar-grid');
                if(!calDiv) return;
                const emp = App.currentUser;
                const daysOfWeek = ['Dom', 'Lun', 'Mar', 'Mié', 'Jue', 'Vie', 'Sáb'];
                let html = daysOfWeek.map(d => `<div class="font-bold text-slate-400 text-xs py-2 uppercase">${d}</div>`).join('');
                const today = new Date(); const year = today.getFullYear(); const month = today.getMonth();
                const firstDay = new Date(year, month, 1); const lastDay = new Date(year, month + 1, 0);
                for (let i = 0; i < firstDay.getDay(); i++) html += `<div></div>`;

                for (let d = 1; d <= lastDay.getDate(); d++) {
                    const dateStr = `${year}-${String(month+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
                    const isToday = d === today.getDate() ? 'ring-2 ring-blue-600 ring-offset-1' : '';
                    let bgClass = ''; let label = ''; let icon = '';

                    const shift = App.getNewShiftForDate(dateStr, emp.cuadrilla);
                    if (shift === 'D') { bgClass = 'bg-orange-50 border border-orange-200 text-orange-800'; label = 'Día (12h)'; icon = '<i class="fa-solid fa-sun text-orange-500"></i>'; }
                    else if (shift === 'N') { bgClass = 'bg-indigo-50 border border-indigo-200 text-indigo-800'; label = 'Noche (12h)'; icon = '<i class="fa-solid fa-moon text-indigo-500"></i>'; }
                    else { bgClass = 'bg-green-50 border border-green-200 text-green-800 opacity-80'; label = 'Descanso'; icon = '<i class="fa-solid fa-mug-hot text-green-600"></i>'; }
                    
                    html += `
                        <div class="calendar-day ${bgClass} ${isToday} rounded-lg p-1 flex flex-col justify-center items-center shadow-sm relative overflow-hidden transition-transform hover:scale-105">
                            <span class="text-[10px] sm:text-xs font-bold self-start pl-1 z-10">${d}</span>
                            ${icon ? `<div class="text-lg sm:text-2xl my-0.5 z-10 opacity-90">${icon}</div>` : ''}
                            <span class="text-[9px] sm:text-[10px] font-bold tracking-tight leading-tight mt-auto z-10">${label}</span>
                        </div>
                    `;
                }
                calDiv.innerHTML = html;
            }
        };

        window.addEventListener('DOMContentLoaded', () => App.init());
    </script>
</body>
</html>
