<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TurnoSync - Sistema Integral 2-2-3</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- PWA Manifest Link -->
    <link id="manifest-link" rel="manifest" href="">
    <meta name="theme-color" content="#1e3a8a">

    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; -webkit-tap-highlight-color: transparent; }
        .fade-in { animation: fadeIn 0.3s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .calendar-day { min-height: 80px; }
        
        .old-empalme { background-color: #fee2e2; border: 2px solid #ef4444; color: #991b1b; }
        .old-manana { background-color: #fef9c3; border: 1px solid #fde047; color: #854d0e; }
        .old-tarde { background-color: #ffedd5; border: 1px solid #fdba74; color: #9a3412; }
        .old-noche { background-color: #e2e8f0; border: 1px solid #cbd5e1; color: #334155; }
        
        /* Motor de Impresión Inteligente */
        @media print {
            .no-print { display: none !important; }
            body { background-color: white !important; color: black !important; }
            #app-container { padding: 0 !important; margin: 0 !important; max-width: 100% !important; }
            .shadow-sm, .shadow-md, .shadow-lg { box-shadow: none !important; }
            .border { border-color: #cbd5e1 !important; }
            .print-only { display: block !important; }
        }
        
        .bg-paper { background-color: #fdfbf7; background-image: url('data:image/svg+xml,%3Csvg width="100" height="100" xmlns="http://www.w3.org/2000/svg"%3E%3Cfilter id="noise"%3E%3CfeTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="4" stitchTiles="stitch"/%3E%3C/filter%3E%3Crect width="100" height="100" fill="%23fdfbf7"/%3E%3Crect width="100" height="100" filter="url(%23noise)" opacity="0.08"/%3E%3C/svg%3E'); }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 antialiased min-h-screen flex flex-col">

    <!-- Navbar -->
    <nav class="bg-blue-900 text-white shadow-md no-print">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex items-center justify-between h-16">
                <div class="flex items-center gap-3">
                    <i class="fa-solid fa-industry text-2xl text-blue-300"></i>
                    <span class="font-bold text-xl tracking-wide">TurnoSync <span class="text-xs font-normal text-blue-200" id="nav-system-mode">Global</span></span>
                </div>
                <div id="nav-user-info" class="hidden flex items-center gap-4">
                    <span id="nav-user-name" class="text-sm font-medium hidden sm:block"></span>
                    <span id="nav-user-role" class="text-[10px] bg-blue-800 px-2 py-1 rounded font-bold uppercase tracking-wider border border-blue-700"></span>

    <!-- Main Content Area -->
    <main id="app-container" class="flex-grow flex flex-col p-4 sm:p-6 max-w-7xl mx-auto w-full">
        <!-- Vistas renderizadas por JS -->
    </main>

    <footer class="bg-slate-200 text-slate-500 text-center py-4 text-xs mt-auto no-print">
        &copy; 2026 TurnoSync Industrial - Modelo 2-2-3 Optimizado. Corrugadora Guatemala S.A.
    </footer>

    <script>
        // ==========================================
        // CONFIGURACIÓN PWA Y MANIFEST
        // ==========================================
        const manifestJSON = {
            "name": "TurnoSync Gestión Laboral", "short_name": "TurnoSync", "display": "standalone", "background_color": "#f8fafc", "theme_color": "#1e3a8a",
            "icons": [{"src": "data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCAyNCAyNCIgZmlsbD0iIzFlM2E4YSI+PHBhdGggZD0iTTEyIDJDMi42OSAyIDEwLjA5IDQgOS4yNyA0LjAzbC0xLjA2LjA2QzcuMTQgNC4yNSA2LjIzIDQuNiA1LjQzIDUuNDNjLS44LjgtMS4xNSAxLjcxLTEuMzQgMi43OGwtLjA2IDEuMDZDMiAyIDEgMi42OSAxIDEyYzAgOS4zMSAxIDkuOTEgMS45NyA5Ljk3bDEuMDYuMDZjLjguMTYgMS43MS41MSAyLjUxIDEuMzEuOC44IDEuMTUgMS43MSAxLjM0IDIuNzhsLjA2IDEuMDZDMiAyMiAyLjY5IDIzIDEyIDIzYzkuMzEgMCA5LjkxLTEgOS45Ny0xLjk3bC4wNi0xLjA2Yy4xNi0uOC41MS0xLjcxIDEuMzEtMi41MS44LS44IDEuNzEtMS4xNSAyLjc4LTEuMzRsMS4wNi0uMDZDMjIgMjIgMjMgMjEuMzEgMjMgMTJjMC05LjMxLTEtOS45MS0xLjk3LTkuOTdsLTEuMDYtLjA2Yy0uOC0uMTYtMS43MS0uNTEtMi41MS0xLjMxLS44LS44LTEuMTUtMS43MS0xLjM0LTIuNzhsLS4wNi0xLjA2QzIyIDIgMjEuMzEgMSAxMiAxaC0yem0wIDJhOCA4IDAgMTAwIDE2IDggOCAwIDAwMC0xNnptMCAxLjVhNi41IDYuNSAwIDExMCAxMyA2LjUgNi41IDAgMDExMC0xM3pNMTIgN2ExIDEgMCAwMTAgMmgzdjNhMSAxIDAgMDEwIDJoLTRhMSAxIDAgMDEwLTIgM2gtMnYtM2ExIDEgMCAwMTAtMmg0YTEgMSAwIDAwMC0yeiIvPjwvc3ZnPg==", "sizes": "192x192", "type": "image/svg+xml"}]
        };
        const manifestBlob = new Blob([JSON.stringify(manifestJSON)], {type: 'application/manifest+json'});
        document.getElementById('manifest-link').href = URL.createObjectURL(manifestBlob);

        // ==========================================
        // BASE DE DATOS LOCAL (IndexedDB)
        // ==========================================
        const DB = {
            dbName: 'TurnoSyncDB_v9',
            version: 1,
            db: null,
            init() {
                return new Promise((resolve, reject) => {
                    const request = indexedDB.open(this.dbName, this.version);
                    request.onupgradeneeded = (e) => {
                        const db = e.target.result;
                        if (!db.objectStoreNames.contains('employees')) {
                            const empStore = db.createObjectStore('employees', { keyPath: 'dpi' });
                            empStore.createIndex('numEmpleado', 'numEmpleado', { unique: true });
                        }
                        if (!db.objectStoreNames.contains('settings')) db.createObjectStore('settings', { keyPath: 'id' });
                    };
                    request.onsuccess = async (e) => { this.db = e.target.result; await this.initDefaultSettings(); resolve(); };
                    request.onerror = (e) => reject(e);
                });
            },
            initDefaultSettings() {
                return new Promise(async (resolve) => {
                    let settings = await this.get('settings', 'config');
                    if (!settings) {
                        settings = { 
                            id: 'config', 
                            sistemaGlobal: '2-2-3',
                            fechaInicio: '2026-05-04', // Lunes de inicio base
                            direccionRotacion: 'atras', // 'atras' (M->N->T) o 'adelante' (M->T->N)
                            holidays: [ { date: '2026-05-01', name: 'Día del Trabajo', isWorked: true } ] 
                        };
                    }
                    if (!settings.sistemaGlobal) settings.sistemaGlobal = '2-2-3';
                    if (!settings.fechaInicio) settings.fechaInicio = '2026-05-04';
                    if (!settings.direccionRotacion) settings.direccionRotacion = 'atras';

                    if (!settings.maquinas) settings.maquinas = [{ nombre: 'Corrugadora 1', activa: true }];
                    
                    if (!settings.supervisores) {
                        settings.supervisores = [{ nombre: 'Supervisor General', maquinas: ['Corrugadora 1'], cuadrillas: ['A', 'B', 'C', 'D', 'Fijo Día', 'Fijo Noche'] }];
                    }

                    if (!settings.puestos) settings.puestos = ['Operador', 'Ayudante', 'Tintero', 'Alimentador', 'Entarimador 1', 'Entarimador 2'];
                    
                    await this.put('settings', settings);
                    resolve();
                });
            },
            get(storeName, key) {
                return new Promise((resolve, reject) => {
                    const tx = this.db.transaction(storeName, 'readonly');
                    const request = tx.objectStore(storeName).get(key);
                    request.onsuccess = () => resolve(request.result);
                    request.onerror = () => reject(request.error);
                });
            },
            getAll(storeName) {
                return new Promise((resolve, reject) => {
                    const tx = this.db.transaction(storeName, 'readonly');
                    const request = tx.objectStore(storeName).getAll();
                    request.onsuccess = () => resolve(request.result);
                    request.onerror = () => reject(request.error);
                });
            },
            put(storeName, item) {
                return new Promise((resolve, reject) => {
                    const tx = this.db.transaction(storeName, 'readwrite');
                    const request = tx.objectStore(storeName).put(item);
                    request.onsuccess = () => resolve(request.result);
                    request.onerror = () => reject(request.error);
                });
            },
            delete(storeName, key) {
                return new Promise((resolve, reject) => {
                    const tx = this.db.transaction(storeName, 'readwrite');
                    const request = tx.objectStore(storeName).delete(key);
                    request.onsuccess = () => resolve();
                    request.onerror = () => reject(request.error);
                });
            },
            async exportJSON() {
                // Exportación Global de RRHH (Backup)
                const employees = await this.getAll('employees');
                const settings = await this.getAll('settings');
                const blob = new Blob([JSON.stringify({ employees, settings }, null, 2)], { type: 'application/json' });
                const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `TurnoSync_Backup_RRHH.json`; a.click();
            },
            async exportEmployeeJSON(dpi) {
                // Exportación Segura Individual (Para enviarle a un trabajador)
                const emp = await this.get('employees', dpi);
                const settings = await this.getAll('settings');
                const blob = new Blob([JSON.stringify({ employees: [emp], settings }, null, 2)], { type: 'application/json' });
                const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `TurnoSync_Acceso_${emp.numEmpleado}.json`; a.click();
            },
            async importJSON(jsonData) {
                try {
                    const data = JSON.parse(jsonData);
                    if (data.employees) for (const emp of data.employees) await this.put('employees', emp);
                    if (data.settings) for (const set of data.settings) await this.put('settings', set);
                    return true;
                } catch (e) { return false; }
            }
        };

        // ==========================================
        // LÓGICA DE NEGOCIO Y CÁLCULO
        // ==========================================
        const App = {
            currentUser: null, role: null, settings: null,
            calendarViewMode: 'new',
            
            // Patrones Rotativos 2-2-3
            patternA: ['D','D','L','L','D','D','D','L','L','D','D','L','L','L','N','N','L','L','N','N','N','L','L','N','N','L','L','L'],
            patternB: ['N','N','L','L','N','N','N','L','L','N','N','L','L','L','D','D','L','L','D','D','D','L','L','D','D','L','L','L'],
            patternC: ['L','L','D','D','L','L','L','D','D','L','L','D','D','D','L','L','N','N','L','L','L','N','N','L','L','N','N','N'],
            patternD: ['L','L','N','N','L','L','L','N','N','L','L','N','N','N','L','L','D','D','L','L','L','D','D','L','L','D','D','D'],
            
            // Patrones Fijos 2-2-3 (Ciclo de 14 días que no rota)
            patternFijoDia: ['D','D','L','L','D','D','D','L','L','D','D','L','L','L'],
            patternFijoNoche: ['N','N','L','L','N','N','N','L','L','N','N','L','L','L'],

            // Patrones Antiguos de 3 Turnos (Ciclo de 21 Días)
            // Hacia Atrás (Mañana -> Noche -> Tarde)
            oldCycleAtras: ['M','M','M','M','M','M','N12', 'N','N','N','N','N','N','L', 'T','T','T','T','T','T','D12'],
            // Hacia Adelante (Mañana -> Tarde -> Noche)
            oldCycleAdelante: ['M','M','M','M','M','M','L', 'T','T','T','T','T','T','D12', 'N','N','N','N','N','N','N12'],

            async init() { 
                await DB.init(); 
                this.settings = await DB.get('settings', 'config'); 
                document.getElementById('nav-system-mode').innerText = `Sistema: ${this.settings.sistemaGlobal}`;
                this.renderLogin(); 
            },

            getAnchorDate() {
                // Generar objeto de fecha ancla basado en la configuración guardada
                return new Date(`${this.settings.fechaInicio}T00:00:00-06:00`);
            },

            async login(dpi, numEmpleado) {
                if (dpi === 'admin' && numEmpleado === 'admin') {
                    this.currentUser = { nombre: 'Administrador General' }; this.role = 'admin'; this.updateNav(); UI.renderAdminDashboard(); return;
                }
                const emp = await DB.get('employees', dpi);
                if (emp && emp.numEmpleado === numEmpleado) {
                    this.currentUser = emp;
                    
                    // ¿Es Supervisor? (Verificamos si su nombre está en el catálogo de supervisores)
                    const isSupervisor = this.settings.supervisores.find(s => s.nombre.toLowerCase() === emp.nombre.toLowerCase());
                    
                    if (isSupervisor) {
                        this.role = 'supervisor';
                        this.currentUser.supervisorInfo = isSupervisor; // Guardar sus permisos
                        this.updateNav();
                        UI.renderSupervisorDashboard();
                    } else {
                        this.role = 'employee'; 
                        this.calendarViewMode = 'boleta'; 
                        this.updateNav(); 
                        UI.renderEmployeeDashboard();
                    }
                } else { alert('Credenciales incorrectas.'); }
            },

            logout() { this.currentUser = null; this.role = null; document.getElementById('nav-user-info').classList.add('hidden'); this.renderLogin(); },
            updateNav() { 
                document.getElementById('nav-user-info').classList.remove('hidden'); 
                document.getElementById('nav-user-name').innerText = this.currentUser.nombre; 
                document.getElementById('nav-user-role').innerText = this.role;
            },

            renderLogin() {
                document.getElementById('app-container').innerHTML = `
                    <div class="flex-grow flex items-center justify-center fade-in">
                        <div class="bg-white p-8 rounded-xl shadow-lg w-full max-w-md border border-slate-100">
                            <div class="text-center mb-6">
                                <div class="bg-blue-100 w-16 h-16 rounded-full flex items-center justify-center mx-auto mb-4"><i class="fa-solid fa-users text-2xl text-blue-800"></i></div>
                                <h2 class="text-2xl font-bold text-slate-800">Portal de Acceso</h2>
                                <p class="text-sm text-slate-500 mt-1">Ingresa para ver tu turno, boleta o panel de control</p>
                            </div>
                            <form id="login-form" class="space-y-4">
                                <div><input type="text" id="login-dpi" class="w-full border border-slate-300 rounded-lg px-4 py-2 focus:ring-2 focus:ring-blue-500 outline-none" placeholder="Ingresa tu DPI" required></div>
                                <div><input type="text" id="login-num" class="w-full border border-slate-300 rounded-lg px-4 py-2 focus:ring-2 focus:ring-blue-500 outline-none" placeholder="Número de Empleado" required></div>
                                <button type="submit" class="w-full bg-blue-800 hover:bg-blue-700 text-white font-bold py-2.5 rounded-lg shadow-md mt-2">Ingresar al Sistema</button>
                            </form>
                            <div class="mt-6 pt-4 border-t border-slate-200">
                                <label class="w-full flex items-center justify-center gap-2 bg-slate-100 hover:bg-slate-200 text-slate-700 py-2 px-4 rounded-lg cursor-pointer text-sm font-semibold">
                                    <i class="fa-solid fa-file-import"></i> Importar Datos (JSON)
                                    <input type="file" class="hidden" id="import-json-input" accept=".json">
                                </label>
                            </div>
                        </div>
                    </div>`;
                document.getElementById('login-form').addEventListener('submit', (e) => { e.preventDefault(); this.login(document.getElementById('login-dpi').value.trim(), document.getElementById('login-num').value.trim()); });
                document.getElementById('import-json-input').addEventListener('change', (e) => {
                    const file = e.target.files[0]; if (!file) return; const reader = new FileReader();
                    reader.onload = async (event) => { if (await DB.importJSON(event.target.result)) { alert("Datos actualizados. Inicia sesión."); App.init(); } };
                    reader.readAsText(file);
                });
            },

            calcularBoletaCatorcenal(emp) {
                const sbm = Number(emp.salarioBase || 5001.60);
                const valorHora = sbm / 30 / 8;
                const valorExtra = valorHora * 1.5;

                let defaultOrd = 56; let defaultExt = 28;
                if (emp.cuadrilla === 'Fijo Noche') { defaultOrd = 42; defaultExt = 42; }

                const hrsOrd = emp.hrsOrd !== undefined ? Number(emp.hrsOrd) : defaultOrd;
                const hrsExt = emp.hrsExt !== undefined ? Number(emp.hrsExt) : defaultExt;

                const devOrd = hrsOrd * valorHora;
                const devExt = hrsExt * valorExtra;
                
                const adicionales = Number(emp.adicionales || 0);
                const bonoIncentivo = 116.67; 
                const bonoExtraordinario = 144.67; 
                const feriados = Number(emp.feriados || 0);

                const septimoDia = (devOrd + devExt + bonoIncentivo) / 6;

                const totalDevengado = devOrd + devExt + septimoDia + bonoIncentivo + bonoExtraordinario + adicionales + feriados;

                const baseIgss = devOrd + devExt + septimoDia + adicionales + feriados;
                const igss = baseIgss * 0.0483;
                
                const cafeteria = Number(emp.deduccionCafeteria || 0);
                const isr = Number(emp.isr || 0);
                const moto = Number(emp.cuotaMoto || 0);

                const totalDeducciones = igss + cafeteria + isr + moto;
                const neto = totalDevengado - totalDeducciones;

                return {
                    valorHora, valorExtra, hrsOrd, hrsExt,
                    devOrd, devExt, adicionales, bonoIncentivo, bonoExtraordinario, feriados, septimoDia, totalDevengado,
                    baseIgss, igss, cafeteria, isr, moto, totalDeducciones, neto,
                    periodoNombre: 'Proyección Actual', fecha: new Date().toISOString()
                };
            },

            async guardarPlanillaGlobal(periodoNombre) {
                const employees = await DB.getAll('employees');
                for (let emp of employees) {
                    const boleta = this.calcularBoletaCatorcenal(emp);
                    boleta.periodoNombre = periodoNombre;
                    
                    if (!emp.historial) emp.historial = [];
                    emp.historial.unshift(boleta);
                    
                    // Resetear variables operativas de la planilla
                    emp.adicionales = 0;
                    emp.feriados = 0;
                    emp.deduccionCafeteria = 0; 
                    emp.isr = 0; 
                    
                    // Reset de horas basado en su turno fijo
                    if(emp.cuadrilla === 'Fijo Noche') { emp.hrsOrd = 42; emp.hrsExt = 42; }
                    else { emp.hrsOrd = 56; emp.hrsExt = 28; } // Rotativo o Fijo Día
                    
                    await DB.put('employees', emp);
                }
            },

            formatMoney(amount) { return new Intl.NumberFormat('es-GT', { style: 'currency', currency: 'GTQ' }).format(amount); },
            
            getNewShiftForDate(dateStr, cuadrilla) {
                const targetDate = new Date(`${dateStr}T00:00:00-06:00`);
                const diffTime = targetDate.getTime() - this.getAnchorDate().getTime();
                const diffDays = Math.floor(diffTime / (1000 * 60 * 60 * 24));
                
                let result = 'L';
                if (cuadrilla === 'Fijo Día') {
                    let cycleDay = diffDays % 14; if (cycleDay < 0) cycleDay += 14;
                    result = this.patternFijoDia[cycleDay];
                } else if (cuadrilla === 'Fijo Noche') {
                    let cycleDay = diffDays % 14; if (cycleDay < 0) cycleDay += 14;
                    result = this.patternFijoNoche[cycleDay];
                } else {
                    let cycleDay = diffDays % 28; if (cycleDay < 0) cycleDay += 28;
                    if (cuadrilla === 'A') result = this.patternA[cycleDay];
                    else if (cuadrilla === 'B') result = this.patternB[cycleDay];
                    else if (cuadrilla === 'C') result = this.patternC[cycleDay];
                    else if (cuadrilla === 'D') result = this.patternD[cycleDay];
                }
                return result;
            },
            
            getOldShiftForDate(dateStr, cuadrillaAntigua) {
                const targetDate = new Date(`${dateStr}T00:00:00-06:00`);
                const diffTime = targetDate.getTime() - this.getAnchorDate().getTime();
                const diffDays = Math.floor(diffTime / (1000 * 60 * 60 * 24));
                
                // Desfase para los turnos 2 y 3 (cada turno inicia con 7 días de diferencia)
                let offset = 0;
                if (cuadrillaAntigua === '2') offset = 7;
                if (cuadrillaAntigua === '3') offset = 14;
                
                let cycleDay = (diffDays + offset) % 21;
                if (cycleDay < 0) cycleDay += 21;
                
                const currentCycle = this.settings.direccionRotacion === 'adelante' ? this.oldCycleAdelante : this.oldCycleAtras;
                return currentCycle[cycleDay];
            }
        };

        // ==========================================
        // RENDERIZADO DE INTERFAZ (UI)
        // ==========================================
        const UI = {
            async renderAdminDashboard() {
                const container = document.getElementById('app-container');
                container.innerHTML = `
                    <div class="fade-in w-full space-y-6">
                        <div class="flex flex-col md:flex-row justify-between items-center bg-white p-4 rounded-lg shadow-sm border border-slate-200 gap-4 no-print">

                            <div class="flex gap-2 w-full md:w-auto overflow-x-auto pb-1">
                                <button onclick="UI.showAdminTab('estructura')" id="tab-btn-estructura" class="admin-tab-btn bg-slate-200 text-slate-700 px-4 py-2 rounded shadow text-sm font-medium whitespace-nowrap"><i class="fa-solid fa-building mr-1"></i> Estructura</button>
                                <button onclick="UI.showAdminTab('empleados')" id="tab-btn-empleados" class="admin-tab-btn bg-slate-200 text-slate-700 px-4 py-2 rounded shadow text-sm font-medium whitespace-nowrap"><i class="fa-solid fa-address-card mr-1"></i> Empleados</button>
                                <button onclick="UI.showAdminTab('procesos')" id="tab-btn-procesos" class="admin-tab-btn bg-slate-200 text-slate-700 px-4 py-2 rounded shadow text-sm font-medium whitespace-nowrap"><i class="fa-solid fa-sitemap mr-1"></i> Procesos</button>
                                <button onclick="UI.showAdminTab('planillas')" id="tab-btn-planillas" class="admin-tab-btn bg-slate-200 text-slate-700 px-4 py-2 rounded shadow text-sm font-medium whitespace-nowrap"><i class="fa-solid fa-money-check-dollar mr-1"></i> Planillas</button>
                                <button onclick="UI.showAdminTab('historial')" id="tab-btn-historial" class="admin-tab-btn bg-slate-200 text-slate-700 px-4 py-2 rounded shadow text-sm font-medium whitespace-nowrap"><i class="fa-solid fa-clock-rotate-left mr-1"></i> Historial</button>
                                <button onclick="DB.exportJSON()" class="bg-green-600 hover:bg-green-700 text-white px-4 py-2 rounded shadow text-sm font-medium whitespace-nowrap" title="Exportar Backup Global de RRHH"><i class="fa-solid fa-database mr-1"></i> Backup</button>
                            </div>
                        </div>
                        <div id="admin-content-area" class="bg-white rounded-lg shadow-sm border border-slate-200 p-4 sm:p-6 min-h-[500px]"></div>
                    </div>

            // Funciones de Lógica de la Estructura
            async updateGlobalSettings() { 
                App.settings.sistemaGlobal = document.getElementById('config-sistema').value; 
                App.settings.fechaInicio = document.getElementById('config-fecha').value; 
                App.settings.direccionRotacion = document.getElementById('config-rotacion').value; 
                await DB.put('settings', App.settings); 
                document.getElementById('nav-system-mode').innerText = `Sistema: ${App.settings.sistemaGlobal}`; 
            },
            
            async addMaquina(e) { e.preventDefault(); const val = document.getElementById('new-maq').value.trim(); if (val && !App.settings.maquinas.find(m => m.nombre === val)) { App.settings.maquinas.push({nombre: val, activa: true}); await DB.put('settings', App.settings); this.renderAdminEstructura(); } },
            async toggleMaquina(idx) { App.settings.maquinas[idx].activa = !App.settings.maquinas[idx].activa; await DB.put('settings', App.settings); this.renderAdminEstructura(); },
            async deleteMaquina(idx) { if(confirm("¿Seguro que desea eliminar esta máquina?")) { App.settings.maquinas.splice(idx, 1); await DB.put('settings', App.settings); this.renderAdminEstructura(); } },
            
            async addSupervisor(e) { e.preventDefault(); const val = document.getElementById('new-sup').value.trim(); if (val && !App.settings.supervisores.find(s => s.nombre === val)) { App.settings.supervisores.push({nombre: val, maquinas: [], cuadrillas: []}); await DB.put('settings', App.settings); this.renderAdminEstructura(); } },
            async deleteSupervisor(idx) { if(confirm("¿Seguro que desea eliminar este supervisor?")) { App.settings.supervisores.splice(idx, 1); await DB.put('settings', App.settings); this.renderAdminEstructura(); } },
            async toggleSupervisorOption(idx, tipo, valor, checked) {
                if(!App.settings.supervisores[idx][tipo]) App.settings.supervisores[idx][tipo] = [];
                if(checked) App.settings.supervisores[idx][tipo].push(valor);
                else App.settings.supervisores[idx][tipo] = App.settings.supervisores[idx][tipo].filter(v => v !== valor);
                await DB.put('settings', App.settings);
            },

            async addPuesto(e) { e.preventDefault(); const val = document.getElementById('new-pue').value.trim(); if (val && !App.settings.puestos.includes(val)) { App.settings.puestos.push(val); await DB.put('settings', App.settings); this.renderAdminEstructura(); } },
            async deletePuesto(idx) { if(confirm("¿Seguro que desea eliminar este puesto?")) { App.settings.puestos.splice(idx, 1); await DB.put('settings', App.settings); this.renderAdminEstructura(); } },

            async filterProcesosMatrix() {
                const sup = document.getElementById('proc-sup').value;
                const maq = document.getElementById('proc-maq').value;
                const area = document.getElementById('procesos-matrix-area');

                if (!sup || !maq) {

                const employees = await DB.getAll('employees');
                const team = employees.filter(e => e.supervisor === sup && e.maquina === maq);
                
                const supervisor = App.settings.supervisores.find(s => s.nombre === sup);
                const cuadrillas = supervisor.cuadrillas || [];
                const puestosOficiales = App.settings.puestos || [];
                
                let matrixHtml = `
                    <div class="bg-white rounded-lg border border-slate-200 overflow-hidden shadow-sm mb-8">

                puestosOficiales.forEach(puesto => {
                    matrixHtml += `<tr><td class="px-4 py-3 font-semibold text-slate-800 bg-slate-50 border-r border-slate-200">${puesto}</td>`;
                    cuadrillas.forEach(cuad => {
                        const worker = team.find(e => e.cuadrilla === cuad && e.puesto === puesto);
                        if (worker) {
                            totalOcupados++;
                            matrixHtml += `<td class="px-2 py-2 text-center border-r border-slate-100"><div class="bg-green-50 border border-green-200 text-green-800 font-bold px-2 py-1 rounded text-xs truncate max-w-[150px] mx-auto" title="${worker.nombre}">${worker.nombre.split(' ')[0]} ${worker.nombre.split(' ')[1]||''}</div></td>`;
                        } else {
                            matrixHtml += `<td class="px-2 py-2 text-center border-r border-slate-100"><div class="bg-red-50 border border-red-300 text-red-600 font-bold px-2 py-1 rounded text-[10px] shadow-inner">VACANTE</div></td>`;
                        }
                    });
                    matrixHtml += `</tr>`;
                });

                matrixHtml += `</tbody></table></div></div>`;
                area.innerHTML = matrixHtml;
            },

            async renderHistorialDetalle(dpi) {
                const container = document.getElementById('historial-detalle-container');
                if (!dpi) { container.innerHTML = `...`; return; }

                const emp = await DB.get('employees', dpi);
                const historial = emp.historial || [];

                if (historial.length === 0) {
                    container.innerHTML = `<div class="text-center py-8 text-slate-500">Sin historial registrado.</div>`;
                    return;
                }

                let sumDevengado = 0;
                historial.forEach(h => sumDevengado += h.totalDevengado);
                const promedioCatorcenal = sumDevengado / historial.length;
                const promedioMensual = (promedioCatorcenal / 14) * 30.4166; 

                let html = `
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-6">
                        <div class="bg-blue-50 p-4 rounded border border-blue-200">
                            <div class="text-xs text-blue-700 font-bold uppercase">Catorcenas Históricas</div>
                            <div class="text-2xl font-black text-blue-900">${historial.length}</div>
                        </div>
                        <div class="bg-green-50 p-4 rounded border border-green-200">
                            <div class="text-xs text-green-700 font-bold uppercase">Sueldo Promedio Mensual</div>
                            <div class="text-2xl font-black text-green-900">${App.formatMoney(promedioMensual)}</div>
                            <div class="text-[10px] text-green-600 mt-1">Proyección legal base para Indemnización / Aguinaldo.</div>
                        </div>
                    </div>
                    <div class="overflow-x-auto border border-slate-200 rounded-lg">
                        <table class="min-w-full divide-y divide-slate-200 text-sm">
                            <thead class="bg-slate-100">
                                <tr>
                                    <th class="px-4 py-2 text-left font-semibold text-slate-600">Período</th>
                                    <th class="px-4 py-2 text-right font-semibold text-slate-600">Devengado</th>
                                    <th class="px-4 py-2 text-right font-semibold text-slate-600">Deducciones</th>
                                    <th class="px-4 py-2 text-right font-semibold text-slate-600">Neto Pagado</th>
                                </tr>
                            </thead>
                            <tbody class="bg-white divide-y divide-slate-200">
                `;
                historial.forEach(h => {
                    html += `<tr><td class="px-4 py-2 font-medium">${h.periodoNombre}</td><td class="px-4 py-2 text-right">${App.formatMoney(h.totalDevengado)}</td><td class="px-4 py-2 text-right text-red-600">${App.formatMoney(h.totalDeducciones)}</td><td class="px-4 py-2 text-right font-bold text-green-700">${App.formatMoney(h.neto)}</td></tr>`;
                });
                html += `</tbody></table></div>`;
                container.innerHTML = html;
            },

            // ==========================================
            // VISTA DE SUPERVISOR (NUEVA VISTA)
            // ==========================================
            async renderSupervisorDashboard() {
                const supInfo = App.currentUser.supervisorInfo;
                const container = document.getElementById('app-container');
                container.innerHTML = `
                    <div class="fade-in space-y-6">
                        <div class="bg-gradient-to-r from-indigo-900 to-indigo-700 rounded-xl p-6 text-white shadow-lg flex flex-col md:flex-row justify-between items-start md:items-center gap-4 no-print">
                            <div>
                                <h1 class="text-2xl font-bold mb-1">Portal del Supervisor</h1>
                                <p class="text-indigo-200 text-sm"><i class="fa-solid fa-user-tie mr-1"></i> ${supInfo.nombre}</p>
                            </div>
                            <div class="text-left md:text-right">
                                <div class="text-xs text-indigo-200 uppercase mb-1">Tus Cuadrillas Activas:</div>
                                <div class="flex gap-1 flex-wrap md:justify-end">
                                    ${(supInfo.cuadrillas||[]).map(c => `<span class="bg-indigo-800 border border-indigo-600 px-2 py-1 rounded font-bold text-[10px] uppercase shadow-sm">${c}</span>`).join('')}
                                </div>
                            </div>
                        </div>

                        <div id="supervisor-content-area" class="bg-white rounded-lg shadow-sm border border-slate-200 p-4 sm:p-6 min-h-[400px] print:shadow-none print:border-none print:p-0">
                            <!-- Aquí se carga la planilla filtrada -->
                        </div>
                    </div>
                `;
                // Renderizar la tabla de planillas pero en Modo Supervisor (solo su equipo)
                this.renderAdminPlanillas(true);
            },

            // ==========================================
            // VISTA DEL EMPLEADO (MANTENIDA)
            // ==========================================
            renderEmployeeDashboard() {
                const container = document.getElementById('app-container');
                container.innerHTML = `
                    <div class="fade-in space-y-6">
                        <div class="flex flex-wrap justify-center mb-6 gap-2 no-print">
                            <button id="btn-view-boleta" onclick="UI.toggleEmployeeView('boleta')" class="px-6 py-2 text-sm font-bold rounded-md bg-blue-800 text-white shadow transition-all"><i class="fa-solid fa-file-invoice-dollar mr-1"></i> Mis Boletas</button>
                            <button id="btn-view-new" onclick="UI.toggleEmployeeView('new')" class="px-6 py-2 text-sm font-bold rounded-md bg-slate-200 text-slate-700 transition-all hover:bg-slate-300"><i class="fa-solid fa-calendar-check mr-1"></i> Mi Turno</button>
                        </div>
                        <div id="employee-content-area"></div>
                    </div>
                `;
                this.toggleEmployeeView(App.calendarViewMode);
            },

            toggleEmployeeView(mode) {
                App.calendarViewMode = mode;
                const area = document.getElementById('employee-content-area');
                ['boleta', 'new'].forEach(id => {
                    const btn = document.getElementById(`btn-view-${id}`);
                    if(btn) {
                        if(id === mode) { btn.classList.remove('bg-slate-200', 'text-slate-700'); btn.classList.add('bg-blue-800', 'text-white', 'shadow'); }
                        else { btn.classList.remove('bg-blue-800', 'text-white', 'shadow'); btn.classList.add('bg-slate-200', 'text-slate-700'); }
                    }
                });

                if (mode === 'boleta') {
                    const emp = App.currentUser;
                    const historial = emp.historial || [];
                    area.innerHTML = `
                        <div class="flex flex-col sm:flex-row justify-between items-center bg-white p-3 rounded shadow-sm border border-slate-200 mb-4 no-print gap-4">
                            <div class="flex items-center w-full sm:w-auto">
                                <label class="text-sm font-bold text-slate-600 mr-2 whitespace-nowrap">Ver Período:</label>
                                <select id="boleta-selector" class="border border-slate-300 rounded p-1.5 text-sm w-full focus:outline-none" onchange="UI.renderBoletaEspecifica(this.value)">
                                    <option value="actual">Catorcena Actual (En curso)</option>
                                    ${historial.map((h, i) => `<option value="${i}">${h.periodoNombre}</option>`).join('')}
                                </select>
                            </div>
                            <button onclick="window.print()" class="bg-slate-800 hover:bg-slate-700 text-white px-4 py-2 rounded shadow text-sm font-medium w-full sm:w-auto"><i class="fa-solid fa-print mr-2"></i> Imprimir</button>
                        </div>
                        <div id="boleta-render-area"></div>
                    `;
                    this.renderBoletaEspecifica('actual');
                } else {
                    area.innerHTML = `
                        <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden fade-in">
                            <div id="calendar-grid" class="grid grid-cols-7 gap-1 p-3 sm:p-5 text-center text-sm bg-slate-50"></div>
                        </div>
                    `;
                    this.renderCalendarGrid();
                }
            },

            renderBoletaEspecifica(index) {
                const emp = App.currentUser;
                let b = index === 'actual' ? App.calcularBoletaCatorcenal(emp) : emp.historial[index];
                document.getElementById('boleta-render-area').innerHTML = `
                    <div id="boleta-imprimible" class="max-w-4xl mx-auto bg-paper border border-slate-300 rounded shadow-md p-8 font-mono text-xs sm:text-sm text-slate-800 relative fade-in print:shadow-none print:border-none print:p-0">
                        <div class="absolute inset-0 flex items-center justify-center opacity-[0.03] pointer-events-none"><i class="fa-solid fa-industry text-[20rem]"></i></div>
                        <div class="relative z-10">
                            <div class="text-center mb-6">
                                <h1 class="text-xl font-black tracking-widest uppercase">CORRUGADORA GUATEMALA, S.A.</h1>
                                <p class="text-slate-600 mt-1">Nit: 67322-6</p>
                                <p class="font-bold text-lg mt-3 border-b border-black inline-block pb-1">BOLETA DE PAGO CATORCENAL</p>
                            </div>
                            <div class="grid grid-cols-2 gap-x-8 gap-y-2 mb-8 bg-white/50 p-4 border border-slate-200 rounded">
                                <div><span class="font-bold">No. Empleado:</span> ${emp.numEmpleado}</div>
                                <div><span class="font-bold">Nombre:</span> ${emp.nombre}</div>
                                <div><span class="font-bold">Puesto:</span> ${emp.puesto}</div>
                                <div><span class="font-bold">Sueldo Base Mensual:</span> ${App.formatMoney(emp.salarioBase)}</div>
                                <div><span class="font-bold">Esquema:</span> Turno ${emp.cuadrilla}</div>
                                <div><span class="font-bold">Período:</span> ${b.periodoNombre}</div>
                            </div>
                            <div class="grid grid-cols-1 md:grid-cols-2 gap-8 mb-8">
                                <div>
                                    <h3 class="font-black border-b-2 border-slate-800 pb-1 mb-3">INGRESOS (DEVENGADO)</h3>
                                    <div class="space-y-1">
                                        <div class="flex justify-between"><span>Ordinario (${b.hrsOrd} Hrs)</span> <span>${App.formatMoney(b.devOrd)}</span></div>
                                        <div class="flex justify-between"><span>Horas Extras (${b.hrsExt} Hrs)</span> <span>${App.formatMoney(b.devExt)}</span></div>
                                        <div class="flex justify-between"><span>Séptimo Día</span> <span>${App.formatMoney(b.septimoDia)}</span></div>
                                        <div class="flex justify-between"><span>Bono Incentivo</span> <span>${App.formatMoney(b.bonoIncentivo)}</span></div>
                                        <div class="flex justify-between"><span>Bonif. Extraordinaria</span> <span>${App.formatMoney(b.bonoExtraordinario)}</span></div>
                                        ${b.adicionales > 0 ? `<div class="flex justify-between"><span>Adicionales</span> <span>${App.formatMoney(b.adicionales)}</span></div>` : ''}
                                        ${b.feriados > 0 ? `<div class="flex justify-between"><span>Feriados</span> <span>${App.formatMoney(b.feriados)}</span></div>` : ''}
                                    </div>
                                </div>
                                <div>
                                    <h3 class="font-black border-b-2 border-slate-800 pb-1 mb-3">DEDUCCIONES</h3>
                                    <div class="space-y-1">
                                        <div class="flex justify-between"><span>IGSS Laboral (4.83%)</span> <span>${App.formatMoney(b.igss)}</span></div>
                                        ${b.cafeteria > 0 ? `<div class="flex justify-between"><span>Cafetería</span> <span>${App.formatMoney(b.cafeteria)}</span></div>` : ''}
                                        ${b.moto > 0 ? `<div class="flex justify-between"><span>Préstamo Moto</span> <span>${App.formatMoney(b.moto)}</span></div>` : ''}
                                        ${b.isr > 0 ? `<div class="flex justify-between"><span>ISR</span> <span>${App.formatMoney(b.isr)}</span></div>` : ''}
                                    </div>
                                </div>
                            </div>
                            <div class="border-t-2 border-slate-800 pt-3 flex flex-col items-end">
                                <div class="w-full md:w-1/2 space-y-2">
                                    <div class="flex justify-between font-bold"><span>Devengado:</span> <span>${App.formatMoney(b.totalDevengado)}</span></div>
                                    <div class="flex justify-between font-bold text-red-700"><span>Deducciones:</span> <span>${App.formatMoney(b.totalDeducciones)}</span></div>
                                    <div class="flex justify-between text-lg font-black bg-slate-100 p-2 border border-slate-300 mt-2"><span>NETO A PAGAR:</span> <span>${App.formatMoney(b.neto)}</span></div>
                                </div>
                            </div>
                        </div>
                    </div>
                `;
            },

            renderCalendarGrid() {
                const calDiv = document.getElementById('calendar-grid');
                if(!calDiv) return;
                const emp = App.currentUser;
                const daysOfWeek = ['Dom', 'Lun', 'Mar', 'Mié', 'Jue', 'Vie', 'Sáb'];
                let html = daysOfWeek.map(d => `<div class="font-bold text-slate-400 text-xs py-2 uppercase">${d}</div>`).join('');
                const today = new Date(); const year = today.getFullYear(); const month = today.getMonth();
                const firstDay = new Date(year, month, 1); const lastDay = new Date(year, month + 1, 0);
                for (let i = 0; i < firstDay.getDay(); i++) html += `<div></div>`;

                for (let d = 1; d <= lastDay.getDate(); d++) {
                    const dateStr = `${year}-${String(month+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
                    const isToday = d === today.getDate() ? 'ring-2 ring-blue-600 ring-offset-1' : '';
                    let bgClass = ''; let label = ''; let icon = '';

                    let shift;
                    if (App.settings.sistemaGlobal === 'Antiguo') {
                        shift = App.getOldShiftForDate(dateStr, emp.cuadrillaAntigua || '1');
                        if (shift === 'M') { bgClass = 'old-manana'; label = 'Mañ (6-14)'; }
                        else if (shift === 'T') { bgClass = 'old-tarde'; label = 'Tar (14-21)'; }
                        else if (shift === 'N') { bgClass = 'old-noche'; label = 'Noc (21-6)'; }
                        else if (shift === 'D12' || shift === 'N12') { bgClass = 'old-empalme'; label = 'Empalme'; icon = '<i class="fa-solid fa-triangle-exclamation"></i>'; }
                        else { bgClass = 'bg-slate-100 text-slate-400 border border-slate-200'; label = 'Libre'; }
                    } else {
                        shift = App.getNewShiftForDate(dateStr, emp.cuadrilla);
                        if (shift === 'D') { bgClass = 'bg-orange-50 border border-orange-200 text-orange-800'; label = 'Día (12h)'; icon = '<i class="fa-solid fa-sun text-orange-500"></i>'; }
                        else if (shift === 'N') { bgClass = 'bg-indigo-50 border border-indigo-200 text-indigo-800'; label = 'Noche (12h)'; icon = '<i class="fa-solid fa-moon text-indigo-500"></i>'; }
                        else { bgClass = 'bg-green-50 border border-green-200 text-green-800 opacity-80'; label = 'Descanso'; icon = '<i class="fa-solid fa-mug-hot text-green-600"></i>'; }
                    }
                    
                    html += `
                        <div class="calendar-day ${bgClass} ${isToday} rounded-lg p-1 flex flex-col justify-center items-center shadow-sm relative overflow-hidden transition-transform hover:scale-105">
                            <span class="text-[10px] sm:text-xs font-bold self-start pl-1 z-10">${d}</span>
                            ${icon ? `<div class="text-lg sm:text-2xl my-0.5 z-10 opacity-90">${icon}</div>` : ''}
                            <span class="text-[9px] sm:text-[10px] font-bold tracking-tight leading-tight mt-auto z-10">${label}</span>
                        </div>
                    `;
                }
                calDiv.innerHTML = html;
            }
        };

        window.addEventListener('DOMContentLoaded', () => App.init());
    </script>
</body>
</html>
